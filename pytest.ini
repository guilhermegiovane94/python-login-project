[pytest]
# Configurações globais para a suíte de testes E2E de login
addopts = -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados (opcional, para filtros futuros)
markers =
    smoke: testes críticos de fumaça
    regression: testes de regressão completa

# Para executar em modo headed (janela visível), use:
#   pytest tests/test_login.py --headed
# Para executar em outro navegador, use:
#   pytest tests/test_login.py --browser firefox
